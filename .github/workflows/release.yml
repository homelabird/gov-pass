name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DIST_DIR: dist/release

jobs:
  build_release:
    name: Build Release Bundles
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip wixl msitools osslsigncode openssl pkg-config gcc dpkg-dev git

      - name: Build release assets
        env:
          PKG_VERSION: ${{ github.ref_name }}
          RELEASE_CHECKSUM_SIGNING_KEY_PATH: ""
          RELEASE_CHECKSUM_SIGNING_KEY_PEM: ${{ secrets.RELEASE_CHECKSUM_SIGNING_KEY_PEM }}
          RELEASE_CHECKSUM_SIGNING_KEY_PEM_B64: ${{ secrets.RELEASE_CHECKSUM_SIGNING_KEY_PEM_B64 }}
          RELEASE_CHECKSUM_SIGNING_KEY_PASS: ${{ secrets.RELEASE_CHECKSUM_SIGNING_KEY_PASS }}
          WINDOWS_CODESIGN_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL }}
          WINDOWS_CODESIGN_TIMESTAMP_URLS: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URLS }}
          WINDOWS_CODESIGN_DESC: gov-pass
          WINDOWS_CODESIGN_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          validate_release_version() {
            value="$1"
            case "$value" in
              ''|.*|*/*|*\\*)
                echo "Invalid release version: $value"
                exit 1
                ;;
            esac
            if ! printf '%s\n' "$value" | grep -Eq '^v?[0-9][0-9A-Za-z._+-]*$'; then
              echo "Invalid release version: $value"
              exit 1
            fi
          }

          validate_release_version "$PKG_VERSION"

          safe_remove_dir() {
            path="$1"
            expected_parent="$2"
            case "$path" in
              ""|"/"|"."|".."|*"/.."|*"/../"*)
                echo "Refusing to remove unsafe directory: $path"
                exit 1
                ;;
            esac
            case "$path" in
              "$expected_parent"/*) ;;
              *)
                echo "Refusing to remove directory outside $expected_parent: $path"
                exit 1
                ;;
            esac
            if [ -L "$path" ]; then
              echo "Refusing to remove symlink directory: $path"
              exit 1
            fi
            rm -rf "$path"
          }

          mkdir -p "$DIST_DIR"
          BASE_DIR="$DIST_DIR"
          cp scripts/install_one_touch_curl.sh "$BASE_DIR/install_one_touch_curl.sh"

          MSI_VERSION="$(echo "$PKG_VERSION" | sed -E 's/^v?([0-9]+)(\.([0-9]+))?(\.([0-9]+))?.*$/\1.\3.\5/' | awk -F. '{ printf "%d.%d.%d", $1, ($2==""?0:$2), ($3==""?0:$3) }')"

          stage_common() {
            dest="$1"
            mkdir -p "$dest/docs/examples" "$dest/docs/schema" "$dest/licenses"
            cp LICENSE "$dest/"
            cp README.md SECURITY.md "$dest/"
            cp docs/DESIGN.md "$dest/docs/"
            cp docs/THIRD_PARTY_NOTICES.md "$dest/docs/"
            cp docs/examples/splitter.*.json "$dest/docs/examples/"
            cp docs/schema/* "$dest/docs/schema/"
            cp third_party/windivert/WinDivert-2.2.2-A/LICENSE "$dest/licenses/WinDivert-LICENSE.txt"
            cp third_party/go-nfqueue/LICENSE "$dest/licenses/go-nfqueue-LICENSE.txt"
            cp third_party/netlink/LICENSE.md "$dest/licenses/netlink-LICENSE.txt"
          }

          maybe_sign_windows() {
            if [[ -z "${WINDOWS_CODESIGN_PFX_B64:-}" || -z "${WINDOWS_CODESIGN_PFX_PASSWORD:-}" ]]; then
              echo "Skipping Windows Authenticode signing; signing secrets are not configured."
              return 0
            fi
            bash scripts/ci/sign_windows_artifacts.sh "$@"
          }

          LINUX_DIR="$BASE_DIR/gov-pass-${PKG_VERSION}-linux-amd64"
          mkdir -p "$LINUX_DIR"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$LINUX_DIR/splitter" ./cmd/splitter
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$LINUX_DIR/gov-pass-tui" ./cmd/gov-pass-tui
          cp scripts/linux/gov-pass.service "$LINUX_DIR/"
          cp scripts/linux/gov-pass.default "$LINUX_DIR/"
          stage_common "$LINUX_DIR"
          tar -C "$BASE_DIR" -czf "$BASE_DIR/gov-pass-${PKG_VERSION}-linux-amd64.tar.gz" "gov-pass-${PKG_VERSION}-linux-amd64"

          FREEBSD_DIR="$BASE_DIR/gov-pass-${PKG_VERSION}-freebsd-amd64"
          mkdir -p "$FREEBSD_DIR"
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -o "$FREEBSD_DIR/splitter" ./cmd/splitter
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -o "$FREEBSD_DIR/gov-pass-tui" ./cmd/gov-pass-tui
          mkdir -p "$FREEBSD_DIR/scripts/freebsd" "$FREEBSD_DIR/docs/pf"
          cp scripts/freebsd/gov-pass scripts/freebsd/install_pf_anchor.sh scripts/freebsd/uninstall_pf_anchor.sh scripts/freebsd/gov-pass-apply-pf.sh scripts/freebsd/gov-pass-remove-pf.sh "$FREEBSD_DIR/scripts/freebsd/"
          cp docs/pf/*.conf "$FREEBSD_DIR/docs/pf/"
          stage_common "$FREEBSD_DIR"
          tar -C "$BASE_DIR" -czf "$BASE_DIR/gov-pass-${PKG_VERSION}-freebsd-amd64.tar.gz" "gov-pass-${PKG_VERSION}-freebsd-amd64"

          WIN_DIR="$BASE_DIR/gov-pass-${PKG_VERSION}-windows-amd64"
          mkdir -p "$WIN_DIR"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$WIN_DIR/splitter.exe" ./cmd/splitter
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$WIN_DIR/gov-pass-tui.exe" ./cmd/gov-pass-tui
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$WIN_DIR/gov-pass-msi-helper.exe" ./cmd/gov-pass-msi-helper
          maybe_sign_windows "$WIN_DIR/splitter.exe" "$WIN_DIR/gov-pass-tui.exe" "$WIN_DIR/gov-pass-msi-helper.exe"
          cp third_party/windivert/WinDivert-2.2.2-A/x64/WinDivert.dll "$WIN_DIR/"
          cp third_party/windivert/WinDivert-2.2.2-A/x64/WinDivert64.sys "$WIN_DIR/"
          if [ -f third_party/windivert/WinDivert-2.2.2-A/x64/WinDivert.cat ]; then
            cp third_party/windivert/WinDivert-2.2.2-A/x64/WinDivert.cat "$WIN_DIR/"
          fi
          cp installer/windows/splitter-admin.cmd "$WIN_DIR/"
          cp installer/windows/gov-pass-tui-admin.cmd "$WIN_DIR/"
          cp installer/windows/service-start-admin.cmd "$WIN_DIR/"
          cp installer/windows/service-stop-admin.cmd "$WIN_DIR/"
          cp installer/windows/service-restart-admin.cmd "$WIN_DIR/"
          cp installer/windows/service-reload-admin.cmd "$WIN_DIR/"
          stage_common "$WIN_DIR"
          (
            cd "$BASE_DIR"
            zip -r "gov-pass-${PKG_VERSION}-windows-amd64.zip" "gov-pass-${PKG_VERSION}-windows-amd64"
          )

          MSI_ROOT="$BASE_DIR/gov-pass-msi-root"
          safe_remove_dir "$MSI_ROOT" "$BASE_DIR"
          mkdir -p "$MSI_ROOT"
          cp -a "$WIN_DIR/." "$MSI_ROOT/"
          WXS_OUT="$BASE_DIR/gov-pass.wxs"
          sed -e "s/{{VERSION}}/$MSI_VERSION/g" -e "s|{{SOURCE_DIR}}|gov-pass-msi-root|g" installer/windows/gov-pass.wxs.in > "$WXS_OUT"
          (
            cd "$BASE_DIR"
            wixl -a x64 -o "gov-pass-${PKG_VERSION}-windows-amd64.msi" "gov-pass.wxs"
          )
          maybe_sign_windows "$BASE_DIR/gov-pass-${PKG_VERSION}-windows-amd64.msi"
          (
            cd "$BASE_DIR"
            msiinfo export "gov-pass-${PKG_VERSION}-windows-amd64.msi" ServiceInstall | grep "gov-pass" >/dev/null
            msiinfo export "gov-pass-${PKG_VERSION}-windows-amd64.msi" ServiceControl | grep "gov-pass" >/dev/null
            msiinfo export "gov-pass-${PKG_VERSION}-windows-amd64.msi" Shortcut | grep "Reload gov-pass config" >/dev/null
            msiinfo export "gov-pass-${PKG_VERSION}-windows-amd64.msi" Shortcut | grep "gov-pass TUI" >/dev/null
            msiinfo export "gov-pass-${PKG_VERSION}-windows-amd64.msi" Shortcut | grep "gov-pass-tui-admin.cmd" >/dev/null
            msiinfo export "gov-pass-${PKG_VERSION}-windows-amd64.msi" File | grep "splitter.windows.schema.json" >/dev/null
            msiinfo export "gov-pass-${PKG_VERSION}-windows-amd64.msi" File | grep "splitter.windows.json" >/dev/null
            msiinfo export "gov-pass-${PKG_VERSION}-windows-amd64.msi" File | grep "gov-pass-tui-admin.cmd" >/dev/null
          )

          RAW_TAG="${PKG_VERSION#v}"
          GOV_PASS_GO_BIN="$(command -v go)" bash packaging/deb/build_deb.sh "$RAW_TAG"
          BIN_DEB="dist/gov-pass_${RAW_TAG}_amd64.deb"
          test -f "$BIN_DEB"
          cp "$BIN_DEB" "$DIST_DIR/gov-pass-${PKG_VERSION}-linux-amd64.deb"

          (
            cd "$BASE_DIR"
            sha256sum "install_one_touch_curl.sh" \
              "gov-pass-${PKG_VERSION}-linux-amd64.tar.gz" \
              "gov-pass-${PKG_VERSION}-freebsd-amd64.tar.gz" \
              "gov-pass-${PKG_VERSION}-windows-amd64.zip" \
              "gov-pass-${PKG_VERSION}-windows-amd64.msi" > SHA256SUMS
            sha256sum "gov-pass-${PKG_VERSION}-linux-amd64.deb" > SHA256SUMS.deb
          )
          bash scripts/ci/sign_release_manifests.sh "$BASE_DIR/SHA256SUMS" "$BASE_DIR/SHA256SUMS.deb"

      - name: Upload release bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            dist/release/install_one_touch_curl.sh
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.msi
            dist/release/*.deb
            dist/release/SHA256SUMS
            dist/release/SHA256SUMS.sig
            dist/release/SHA256SUMS.deb
            dist/release/SHA256SUMS.deb.sig
          if-no-files-found: error

  build_rpm_release:
    name: Build RPM Release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build RPM artifacts
        env:
          PKG_VERSION: ${{ github.ref_name }}
          DIST_DIR: dist/release
          RELEASE_CHECKSUM_SIGNING_KEY_PATH: ""
          RELEASE_CHECKSUM_SIGNING_KEY_PEM: ${{ secrets.RELEASE_CHECKSUM_SIGNING_KEY_PEM }}
          RELEASE_CHECKSUM_SIGNING_KEY_PEM_B64: ${{ secrets.RELEASE_CHECKSUM_SIGNING_KEY_PEM_B64 }}
          RELEASE_CHECKSUM_SIGNING_KEY_PASS: ${{ secrets.RELEASE_CHECKSUM_SIGNING_KEY_PASS }}
        run: |
          set -euo pipefail

          validate_release_version() {
            value="$1"
            case "$value" in
              ''|.*|*/*|*\\*)
                echo "Invalid release version: $value"
                exit 1
                ;;
            esac
            if ! printf '%s\n' "$value" | grep -Eq '^v?[0-9][0-9A-Za-z._+-]*$'; then
              echo "Invalid release version: $value"
              exit 1
            fi
          }

          validate_release_version "$PKG_VERSION"

          safe_remove_dir() {
            path="$1"
            expected_parent="$2"
            case "$path" in
              ""|"/"|"."|".."|*"/.."|*"/../"*)
                echo "Refusing to remove unsafe directory: $path"
                exit 1
                ;;
            esac
            case "$path" in
              "$expected_parent"/*) ;;
              *)
                echo "Refusing to remove directory outside $expected_parent: $path"
                exit 1
                ;;
            esac
            if [ -L "$path" ]; then
              echo "Refusing to remove symlink directory: $path"
              exit 1
            fi
            rm -rf "$path"
          }

          dnf -y install --setopt=install_weak_deps=False rpm-build golang gcc git openssl systemd-rpm-macros rpmlint
          mkdir -p "$DIST_DIR"

          RAW_TAG="${PKG_VERSION#v}"
          if echo "$RAW_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([._-].*)?$'; then
            RPM_VERSION="$(echo "$RAW_TAG" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
            RPM_SUFFIX="$(echo "$RAW_TAG" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')"
          else
            echo "Unsupported tag format for RPM: $PKG_VERSION"
            exit 1
          fi

          RPM_RELEASE="1"
          if [ -n "$RPM_SUFFIX" ]; then
            CLEAN_SUFFIX="$(echo "$RPM_SUFFIX" | sed -E 's/^[._-]+//; s/[^A-Za-z0-9._]+/./g; s/^\.+//; s/\.+$//')"
            if [ -n "$CLEAN_SUFFIX" ]; then
              RPM_RELEASE="1.${CLEAN_SUFFIX}"
            fi
          fi

          RPM_TOP="$GITHUB_WORKSPACE/rpmbuild"
          safe_remove_dir "$RPM_TOP" "$GITHUB_WORKSPACE"
          mkdir -p "$RPM_TOP/BUILD" "$RPM_TOP/BUILDROOT" "$RPM_TOP/RPMS" "$RPM_TOP/SOURCES" "$RPM_TOP/SPECS" "$RPM_TOP/SRPMS"
          git archive --format=tar --prefix="gov-pass-${RPM_VERSION}/" HEAD | gzip -n > "$RPM_TOP/SOURCES/gov-pass-${RPM_VERSION}.tar.gz"
          cp packaging/rpm/gov-pass.spec "$RPM_TOP/SPECS/"
          sed -i -E "s/(^\* .* - )[0-9][^[:space:]]*/\1${RPM_VERSION}-${RPM_RELEASE}/" "$RPM_TOP/SPECS/gov-pass.spec"
          cp packaging/rpm/gov-pass.service packaging/rpm/gov-pass.sysconfig "$RPM_TOP/SOURCES/"
          rpmbuild -ba --define "_topdir $RPM_TOP" --define "gov_pass_version $RPM_VERSION" --define "gov_pass_release $RPM_RELEASE" "$RPM_TOP/SPECS/gov-pass.spec"

          BIN_RPM="$(ls "$RPM_TOP"/RPMS/x86_64/gov-pass-"$RPM_VERSION"-*.x86_64.rpm | head -n1)"
          SRC_RPM="$(ls "$RPM_TOP"/SRPMS/gov-pass-"$RPM_VERSION"-*.src.rpm | head -n1)"
          rpmlint "$RPM_TOP/SPECS/gov-pass.spec" "$BIN_RPM"

          cp "$BIN_RPM" "$DIST_DIR/gov-pass-${PKG_VERSION}-linux-amd64.rpm"
          cp "$SRC_RPM" "$DIST_DIR/gov-pass-${PKG_VERSION}-linux.src.rpm"

          (
            cd "$DIST_DIR"
            sha256sum "gov-pass-${PKG_VERSION}-linux-amd64.rpm" "gov-pass-${PKG_VERSION}-linux.src.rpm" > SHA256SUMS.rpm
          )
          bash scripts/ci/sign_release_manifests.sh "$DIST_DIR/SHA256SUMS.rpm"

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: |
            dist/release/*.rpm
            dist/release/*.src.rpm
            dist/release/SHA256SUMS.rpm
            dist/release/SHA256SUMS.rpm.sig
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build_release
      - build_rpm_release
    permissions:
      contents: write
    steps:
      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: dist/release

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-rpm
          path: dist/release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/install_one_touch_curl.sh
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.msi
            dist/release/*.deb
            dist/release/*.rpm
            dist/release/*.src.rpm
            dist/release/SHA256SUMS
            dist/release/SHA256SUMS.sig
            dist/release/SHA256SUMS.deb
            dist/release/SHA256SUMS.deb.sig
            dist/release/SHA256SUMS.rpm
            dist/release/SHA256SUMS.rpm.sig
